<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MedTermQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:var(--color-text-primary);--ink2:var(--color-text-secondary);--ink3:var(--color-text-tertiary);
  --bg:var(--color-background-primary);--bg2:var(--color-background-secondary);--bg3:var(--color-background-tertiary);
  --b:var(--color-border-tertiary);--b2:var(--color-border-secondary);
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-b:#5DCAA5;--teal-dk:#085041;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-b:#F09595;--red-dk:#501313;
  --grn:#3B6D11;--grn-bg:#EAF3DE;--grn-b:#97C459;--grn-dk:#173404;
  --amb:#854F0B;--amb-bg:#FAEEDA;--amb-b:#EF9F27;--amb-dk:#412402;
  --pur:#534AB7;--pur-bg:#EEEDFE;--pur-b:#AFA9EC;--pur-dk:#26215C;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
button{cursor:pointer;font-family:'Inter',sans-serif}input{font-family:'Inter',sans-serif}
.nav{background:#fff;border-bottom:1px solid #e5e0d8;padding:0 20px;display:flex;align-items:center;height:52px;gap:3px;position:sticky;top:0;z-index:50}
.logo{font-family:'DM Serif Display',serif;font-size:19px;color:#1a1a1a;margin-right:8px;flex-shrink:0}
.logo s{color:var(--teal);text-decoration:none;display:inline}
.nb{padding:5px 11px;border-radius:var(--r);border:none;background:transparent;font-size:12px;color:#555;cursor:pointer}
.nb:hover,.nb.on{background:var(--teal-bg);color:var(--teal-dk)}.nb.on{font-weight:500}
.nb-g{background:var(--pur-bg);color:var(--pur-dk)}.nb-g:hover,.nb-g.on{background:var(--pur-b);color:var(--pur-dk)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:5px;flex-shrink:0}
.rbadge{font-size:11px;background:var(--teal-bg);color:var(--teal-dk);padding:2px 8px;border-radius:99px;font-weight:500;text-transform:capitalize}
.page{padding:20px;max-width:880px;margin:0 auto}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f5f5f0}
.acard{width:100%;max-width:390px;background:#fff;border:1px solid #e5e0d8;border-radius:var(--rl);padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.atabs{display:flex;gap:3px;background:#f5f5f0;border-radius:var(--r);padding:3px;margin-bottom:18px}
.at{flex:1;padding:7px;text-align:center;border-radius:6px;font-size:13px;font-weight:500;color:#666;background:transparent;border:none;cursor:pointer;transition:all .12s}
.at.on{background:#fff;color:var(--teal)}
.fi{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:var(--r);font-size:14px;background:#fff;color:#1a1a1a;margin-bottom:9px}
.fi:focus{outline:none;border-color:var(--teal)}
.fi::placeholder{color:#aaa}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flbl{font-size:11px;color:#666;display:block;margin-bottom:3px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.pbtn{width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;margin-top:4px}
.pbtn:hover{background:var(--teal-dk)}
.err{background:var(--red-bg);border:1px solid var(--red-b);color:var(--red-dk);padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px}
.card{background:#fff;border:1px solid #e5e0d8;border-radius:var(--rl);padding:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:580px){.g2{grid-template-columns:1fr}}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:580px){.g4{grid-template-columns:repeat(2,1fr)}}
.met{background:#f5f5f0;border-radius:var(--r);padding:13px}
.ml{font-size:10px;color:#777;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.mv{font-size:20px;font-weight:500}.mv.t{color:var(--teal)}.mv.p{color:var(--pur)}.mv.a{color:var(--amb)}.mv.g{color:var(--grn)}
.ms{font-size:10px;color:#aaa;margin-top:2px}
.sec{font-size:14px;font-weight:500;color:#1a1a1a;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
.bt{background:var(--teal-bg);color:var(--teal-dk)}.ba{background:var(--amb-bg);color:var(--amb-dk)}.bp{background:var(--pur-bg);color:var(--pur-dk);font-family:'DM Mono',monospace}.bgn{background:var(--grn-bg);color:var(--grn-dk)}.br{background:var(--red-bg);color:var(--red-dk)}
.brow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0ede8}
.brow:last-child{border-bottom:none}
.bcat{font-size:11px;color:#777;width:95px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrk{flex:1;height:5px;background:#f0ede8;border-radius:3px;overflow:hidden}
.bfil{height:100%;border-radius:3px;transition:width .5s ease}
.bpct{font-size:10px;font-family:'DM Mono',monospace;color:#888;width:30px;text-align:right}
.gbtn{padding:8px 16px;background:transparent;color:#666;border:1px solid #ccc;border-radius:var(--r);font-size:13px;cursor:pointer}
.gbtn:hover{border-color:var(--teal-b);color:var(--teal)}
.sep{height:1px;background:#f0ede8;margin:14px 0}
.opt{width:100%;text-align:left;padding:10px 14px;margin-bottom:7px;border-radius:var(--r);border:1px solid #ddd;background:#fff;font-size:13px;color:#1a1a1a;cursor:pointer;line-height:1.5;transition:all .12s}
.opt:hover:not([disabled]){border-color:var(--teal-b);background:var(--teal-bg);color:var(--teal-dk)}
.opt.oc{border-color:var(--grn-b);background:var(--grn-bg);color:var(--grn-dk)}
.opt.ow{border-color:var(--red-b);background:var(--red-bg);color:var(--red-dk)}
.opt.or_{border-color:var(--grn-b);background:var(--grn-bg);color:var(--grn-dk);opacity:.45}
.opt[disabled]{cursor:not-allowed}
.fb{border-radius:var(--r);padding:13px 15px;margin-bottom:14px}
.fb.ok{background:var(--grn-bg);border:1px solid var(--grn-b)}
.fb.bad{background:var(--red-bg);border:1px solid var(--red-b)}
.fb-t{font-size:14px;font-weight:500;margin-bottom:5px}
.fb.ok .fb-t{color:var(--grn-dk)}.fb.bad .fb-t{color:var(--red-dk)}
.fb-b{font-size:13px;color:#444;margin-bottom:9px;line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.pm{background:var(--amb-bg);color:var(--amb-dk);padding:2px 7px;border-radius:99px;font-size:10px}
.pr_{background:var(--teal-bg);color:var(--teal-dk);padding:2px 7px;border-radius:99px;font-size:10px}
.pe{background:var(--pur-bg);color:var(--pur-dk);padding:2px 7px;border-radius:99px;font-size:10px;font-family:'DM Mono',monospace}
.pb{height:3px;background:#eee;border-radius:2px;overflow:hidden;margin-bottom:14px}
.pf{height:100%;background:var(--teal);border-radius:2px;transition:width .4s}
.term-d{font-size:24px;font-weight:500;color:var(--teal);margin-bottom:2px;font-family:'DM Serif Display',serif}
.term-r{font-size:11px;color:#aaa;font-style:italic;margin-bottom:14px}

/* GAME */
.game-wrap{max-width:620px;margin:0 auto}
.clue-card{background:var(--pur-bg);border:1px solid var(--pur-b);border-radius:var(--rl);padding:16px 20px;margin-bottom:18px;position:relative}
.clue-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--pur-dk);margin-bottom:5px}
.clue-text{font-size:14px;color:var(--pur-dk);line-height:1.6}
.clue-cat{position:absolute;top:12px;right:14px;font-size:10px;font-weight:500;background:#fff;color:var(--pur-dk);padding:2px 7px;border-radius:99px;border:1px solid var(--pur-b)}
.clue-hint{font-size:11px;color:var(--pur);margin-top:7px;font-style:italic;display:none}
.clue-hint.show{display:block}
.game-grid{display:flex;flex-direction:column;gap:5px;align-items:center;margin-bottom:16px}
.game-row{display:flex;gap:4px}
.gtile{width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:'DM Mono',monospace;text-transform:uppercase;border:2px solid #ddd;background:#fff;color:#1a1a1a;transition:border-color .12s}
.gtile.filled{border-color:#888;animation:pop .1s ease}
.gtile.green{background:#538d4e;border-color:#538d4e;color:#fff}
.gtile.yellow{background:#b59f3b;border-color:#b59f3b;color:#fff}
.gtile.gray{background:#787c7e;border-color:#787c7e;color:#fff}
.gtile.cur-pos{border-color:var(--teal)}
.gtile.reveal{animation:flip .5s ease forwards}
.gtile.reveal:nth-child(2){animation-delay:.08s}.gtile.reveal:nth-child(3){animation-delay:.16s}
.gtile.reveal:nth-child(4){animation-delay:.24s}.gtile.reveal:nth-child(5){animation-delay:.32s}
.gtile.reveal:nth-child(6){animation-delay:.4s}.gtile.reveal:nth-child(7){animation-delay:.48s}
.gtile.reveal:nth-child(8){animation-delay:.56s}.gtile.reveal:nth-child(9){animation-delay:.64s}
.gtile.reveal:nth-child(10){animation-delay:.72s}.gtile.reveal:nth-child(11){animation-delay:.80s}
.gtile.reveal:nth-child(12){animation-delay:.88s}
.gtile.shake{animation:shake .4s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes flip{0%{transform:rotateX(0)}49%{transform:rotateX(-90deg)}50%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.kbd{display:flex;flex-direction:column;gap:5px;align-items:center;margin-bottom:16px}
.kbd-row{display:flex;gap:4px}
.key{min-width:30px;height:44px;padding:0 5px;border-radius:5px;border:none;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;text-transform:uppercase;cursor:pointer;background:#d3d6da;color:#1a1a1a;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center}
.key.wide{min-width:48px;font-size:10px}
.key.green{background:#538d4e;color:#fff}.key.yellow{background:#b59f3b;color:#fff}.key.gray{background:#787c7e;color:#999}
.key.hint-hi{background:var(--pur-b);color:var(--pur-dk);border:1px solid var(--pur)}
.pos-entropy{display:flex;gap:4px;align-items:flex-end;height:44px;margin-bottom:4px;justify-content:center}
.pos-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.pos-bar{width:42px;border-radius:3px 3px 0 0;min-height:2px;transition:height .4s ease,background .3s}
.pos-lbl{font-size:9px;font-family:'DM Mono',monospace;color:#aaa}
.pos-entropy-label{text-align:center;font-size:10px;color:#aaa;margin-bottom:12px;font-family:'DM Mono',monospace}
.hint-box{background:var(--pur-bg);border:1px solid var(--pur-b);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--pur-dk);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint-word{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;letter-spacing:.15em;color:var(--pur-dk)}
.opener-chip{display:inline-flex;align-items:center;gap:7px;background:var(--amb-bg);border:1px solid var(--amb-b);border-radius:99px;padding:5px 13px;font-size:12px;color:var(--amb-dk);cursor:pointer;transition:all .12s}
.opener-chip:hover{background:var(--amb-b)}
.opener-word{font-family:'DM Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.1em}
.solved-banner{background:var(--grn-bg);border:1px solid var(--grn-b);border-radius:var(--rl);padding:18px 22px;text-align:center;margin-bottom:14px;animation:fadeup .3s ease}
.failed-banner{background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--rl);padding:18px 22px;text-align:center;margin-bottom:14px;animation:fadeup .3s ease}
.banner-word{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;letter-spacing:.18em;margin-bottom:4px}
.solved-banner .banner-word{color:var(--grn-dk)}.failed-banner .banner-word{color:var(--red-dk)}
.banner-sub{font-size:12px;color:#555;margin-bottom:12px}
@keyframes fadeup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.len-btn{padding:4px 10px;border-radius:99px;border:1px solid #ddd;background:transparent;font-size:11px;color:#666;cursor:pointer;transition:all .12s}
.len-btn.on{background:var(--teal-bg);border-color:var(--teal-b);color:var(--teal-dk);font-weight:500}
.gh-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0ede8}
.gh-row:last-child{border-bottom:none}
.gh-word{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.08em;color:#1a1a1a;min-width:90px}
.gh-res{font-size:10px;font-weight:500;padding:2px 7px;border-radius:99px}
.gh-ok{background:var(--grn-bg);color:var(--grn-dk)}.gh-fail{background:var(--red-bg);color:var(--red-dk)}
.sr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0ede8}
.sr:last-child{border-bottom:none}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0ede8}
.lb-row:last-child{border-bottom:none}
.km-item{padding:4px 8px;border-radius:var(--r);font-size:10px;font-weight:500;border:1px solid;margin:2px;display:inline-block}
.tabs{display:flex;gap:3px;background:#f5f5f0;border-radius:var(--r);padding:3px;margin-bottom:16px}
.tab{flex:1;padding:7px;text-align:center;border-radius:6px;font-size:12px;font-weight:500;color:#666;background:transparent;border:none;cursor:pointer;transition:all .12s}
.tab.on{background:#fff;color:var(--teal)}
</style>
</head>
<body>
<div id="R"></div>
<script>
const TERMS=[
 {id:"cv1",term:"Tachycardia",cat:"Cardiovascular",d:1,def:"Heart rate exceeding 100 beats per minute at rest.",root:"tachy- (fast) + cardia (heart)",mn:"Too Aggressively Crazy Heartbeat, Yikes",rel:["Bradycardia","Arrhythmia"]},
 {id:"cv2",term:"Bradycardia",cat:"Cardiovascular",d:1,def:"Heart rate below 60 beats per minute at rest.",root:"brady- (slow) + cardia (heart)",mn:"Beats Rather Ardently, Down",rel:["Tachycardia","Heart block"]},
 {id:"cv3",term:"Myocardial Infarction",cat:"Cardiovascular",d:2,def:"Death of heart muscle due to prolonged ischemia from blocked blood supply.",root:"myo+cardia+infarction",mn:"MI = Muscle Is dying",rel:["Angina","Atherosclerosis"]},
 {id:"cv4",term:"Hypertension",cat:"Cardiovascular",d:1,def:"Persistently elevated blood pressure at or above 130/80 mmHg.",root:"hyper- (above) + tension (pressure)",mn:"Silent killer — no symptoms, big damage",rel:["Stroke","Renal failure"]},
 {id:"cv5",term:"Atrial Fibrillation",cat:"Cardiovascular",d:3,def:"Chaotic atrial electrical signals causing an irregular, often rapid heart rate.",root:"atrial + fibrillation (rapid quivering)",mn:"AFib = Atria Firing in Bedlam",rel:["Stroke","Heart failure"]},
 {id:"ne1",term:"Aphasia",cat:"Neurology",d:2,def:"Loss or impairment of language ability due to brain damage.",root:"a- (without) + phasia (speech)",mn:"Broca's = expressive; Wernicke's = receptive",rel:["Stroke","Dysarthria"]},
 {id:"ne2",term:"Epilepsy",cat:"Neurology",d:2,def:"Chronic neurological disorder with recurrent unprovoked seizures.",root:"Greek: epilepsia (to seize upon)",mn:"Electrical storm in the brain",rel:["Seizure","EEG"]},
 {id:"ne3",term:"Ischemic Stroke",cat:"Neurology",d:2,def:"Sudden loss of brain function due to interrupted blood supply from a clot.",root:"ischemia (deficient blood) + stroke",mn:"FAST: Face, Arm, Speech, Time",rel:["TIA","Hemorrhagic stroke"]},
 {id:"ne4",term:"Parkinson's Disease",cat:"Neurology",d:3,def:"Progressive neurodegeneration from dopaminergic neuron loss in the substantia nigra.",root:"Named after James Parkinson (1817)",mn:"TRAP: Tremor, Rigidity, Akinesia, Postural instability",rel:["Dopamine","Lewy body dementia"]},
 {id:"ne5",term:"Syncope",cat:"Neurology",d:2,def:"Transient loss of consciousness from cerebral hypoperfusion, with spontaneous recovery.",root:"Greek: synkope (cutting short)",mn:"Sudden Yet Normal Cardiovascular event",rel:["Orthostatic hypotension","Arrhythmia"]},
 {id:"ne6",term:"Meningitis",cat:"Neurology",d:2,def:"Inflammation of the meninges surrounding brain and spinal cord, usually infectious.",root:"meninges (membranes) + -itis (inflammation)",mn:"Classic triad: Headache, Fever, Neck stiffness",rel:["Encephalitis","Kernig sign"]},
 {id:"re1",term:"Pneumonia",cat:"Respiratory",d:1,def:"Infection of lung parenchyma causing inflammation and impaired gas exchange.",root:"pneumo- (lung) + -ia (condition)",mn:"CURB-65 severity scoring",rel:["Bronchitis","ARDS"]},
 {id:"re2",term:"Asthma",cat:"Respiratory",d:1,def:"Chronic inflammatory airway disease causing reversible bronchospasm and wheezing.",root:"Greek: asthma (panting)",mn:"Wheeze = Airways Squeezed",rel:["COPD","Eosinophilia"]},
 {id:"re3",term:"Pulmonary Embolism",cat:"Respiratory",d:3,def:"Blockage of pulmonary arteries by a blood clot, usually originating from DVT.",root:"pulmonary (lung) + embolism (blockage)",mn:"Virchow's triad: Stasis, Hypercoagulability, Endothelial injury",rel:["DVT","Anticoagulation"]},
 {id:"re4",term:"Dyspnea",cat:"Respiratory",d:1,def:"Subjective sensation of difficult or uncomfortable breathing.",root:"dys- (difficult) + pnea (breathing)",mn:"DYStressing Breaths",rel:["Tachypnea","Hypoxia"]},
 {id:"en1",term:"Diabetes Mellitus",cat:"Endocrinology",d:1,def:"Metabolic disorder of chronic hyperglycemia from defective insulin secretion or action.",root:"diabetes (siphon) + mellitus (honey-sweet)",mn:"Type 1=NO insulin; Type 2=RESISTANT",rel:["Insulin","HbA1c"]},
 {id:"en2",term:"Hypothyroidism",cat:"Endocrinology",d:2,def:"Underactive thyroid causing insufficient thyroid hormone and slowed metabolism.",root:"hypo- (under) + thyroid + -ism",mn:"SLOW: Sluggish, Low energy, Obesity, Weight gain",rel:["TSH","Hashimoto's"]},
 {id:"en3",term:"Hyperthyroidism",cat:"Endocrinology",d:2,def:"Overactive thyroid producing excess hormone, causing accelerated metabolism.",root:"hyper- (over) + thyroid + -ism",mn:"FAST: heat intolerance, weight loss, tremor",rel:["Graves' disease","Thyroid storm"]},
 {id:"ph1",term:"Pharmacokinetics",cat:"Pharmacology",d:3,def:"Study of how the body processes a drug: Absorption, Distribution, Metabolism, Excretion.",root:"pharmakon (drug) + kinetics (movement)",mn:"ADME = A Drug Moves Everywhere",rel:["Bioavailability","Half-life"]},
 {id:"ph2",term:"Half-life",cat:"Pharmacology",d:2,def:"Time for plasma drug concentration to decrease by 50%, determining dosing frequency.",root:"half (50%) + life (duration)",mn:"5 half-lives = drug essentially cleared",rel:["Pharmacokinetics","Clearance"]},
 {id:"ph3",term:"Antagonist",cat:"Pharmacology",d:2,def:"Drug that binds a receptor and blocks its response without activating it.",root:"anti- (against) + agonist (actor)",mn:"Blocks the door, won't open it",rel:["Agonist","IC50"]},
 {id:"pa1",term:"Neoplasia",cat:"Pathology",d:2,def:"Abnormal uncoordinated cell growth persisting after cessation of the initial stimulus.",root:"neo- (new) + plasia (formation)",mn:"New Evil growth",rel:["Carcinoma","Metastasis"]},
 {id:"pa2",term:"Metastasis",cat:"Pathology",d:2,def:"Spread of cancer cells from the primary tumor to distant sites.",root:"meta- (beyond) + stasis (standing)",mn:"Cancer's escape route",rel:["Invasion","Angiogenesis"]},
 {id:"pa3",term:"Ischemia",cat:"Pathology",d:2,def:"Insufficient blood supply to tissue causing oxygen deprivation with risk of infarction.",root:"iskhein (hold back) + haima (blood)",mn:"Reversible if brief; infarction if prolonged",rel:["Infarction","Hypoxia"]},
 {id:"pa4",term:"Inflammation",cat:"Pathology",d:1,def:"Protective vascular and cellular response to injury or infection.",root:"Latin: inflammatio (setting on fire)",mn:"PRISH: Pain, Redness, Immobility, Swelling, Heat",rel:["Cytokines","Edema"]},
 {id:"mi1",term:"Sepsis",cat:"Microbiology",d:2,def:"Life-threatening organ dysfunction from dysregulated host response to infection.",root:"Greek: sepsis (putrefaction)",mn:"qSOFA: Resp>22, Altered mentation, SBP<100",rel:["Septic shock","Bacteremia"]},
 {id:"mi2",term:"Antibiotic Resistance",cat:"Microbiology",d:3,def:"Bacterial ability to survive antibiotics via mutations or acquired resistance genes.",root:"anti-(against)+bios(life)+resistance",mn:"ESKAPE pathogens — the resistant superbugs",rel:["MRSA","Beta-lactamase"]},
 {id:"im1",term:"Anaphylaxis",cat:"Immunology",d:2,def:"Severe rapid systemic IgE-mediated hypersensitivity causing life-threatening compromise.",root:"ana- (against) + phylaxis (protection)",mn:"Epinephrine IM = first-line always",rel:["IgE","Mast cells"]},
 {id:"im2",term:"Autoimmune Disease",cat:"Immunology",d:2,def:"Condition where the immune system mistakenly attacks the body's own healthy cells.",root:"auto- (self) + immune (defense)",mn:"Friendly fire — immune attacks self",rel:["Lupus","Rheumatoid arthritis"]},

const DP={1:.80,2:.60,3:.40,4:.25},POK=.92,PFL=.18,CC=.12;

const bE=p=>{p=Math.max(1e-9,Math.min(1-1e-9,p));return-(p*Math.log2(p)+(1-p)*Math.log2(1-p));};
const aE=b=>Object.values(b).reduce((s,p)=>s+bE(p),0)/Object.values(b).length;
const initB=()=>Object.fromEntries(TERMS.map(t=>[t.id,DP[t.d]||.5]));
const om=b=>+(Object.values(b).reduce((s,v)=>s+v,0)/Object.keys(b).length*100).toFixed(1);
const mc=p=>p>=65?'#3B6D11':p>=35?'#854F0B':'#A32D2D';
const mb=p=>p>=65?'#EAF3DE':p>=35?'#FAEEDA':'#FCEBEB';
const mbr=p=>p>=65?'#97C459':p>=35?'#EF9F27':'#F09595';

function bUpd(b,id,ok){
  const nb={...b},p=nb[id],lk=ok?POK:1-POK,ln=ok?PFL:1-PFL,ev=lk*p+ln*(1-p);
  nb[id]=ev>0?(lk*p)/ev:p;
  const tm=TERMS.find(t=>t.id===id);
  if(tm){const d=nb[id]-p;TERMS.filter(t=>t.cat===tm.cat&&t.id!==id).forEach(t=>{nb[t.id]=Math.max(.01,Math.min(.99,nb[t.id]+d*CC));});}
  return nb;
}
function calcEig(b,id){
  const p=b[id],pok=POK*p+PFL*(1-p),bok=bUpd(b,id,true),bfl=bUpd(b,id,false);
  return aE(b)-(pok*aE(bok)+(1-pok)*aE(bfl));
}
function selNext(b,asked){
  const cs=TERMS.filter(t=>!asked.has(t.id));if(!cs.length)return null;
  let best=cs[0],bs=-1;
  cs.forEach(t=>{const s=calcEig(b,t.id)+(1-Math.abs(b[t.id]-.5)*2)*.03;if(s>bs){bs=s;best=t;}});
  return{term:best,eig:+bs.toFixed(4)};
}
function catM(b){const o={};CATS.forEach(c=>{const ids=TERMS.filter(t=>t.cat===c).map(t=>t.id);o[c]=+((ids.reduce((s,id)=>s+b[id],0)/ids.length)*100).toFixed(1);});return o;}
function mcq(term){
  const ok=term.def,pool=TERMS.filter(t=>t.id!==term.id);
  const sh=a=>[...a].sort(()=>Math.random()-.5);
  const d=sh(pool.filter(t=>t.cat===term.cat)).slice(0,2).concat(sh(pool.filter(t=>t.cat!==term.cat)).slice(0,1)).map(t=>t.def);
  return{opts:sh([...d.slice(0,3),ok]),ok};
}

/* WORDLE ENGINE */
function getPat(guess,answer){
  const n=guess.length,pat=Array(n).fill('gray');
  const ac=answer.split(''),gc=guess.split('');
  for(let i=0;i<n;i++)if(gc[i]===ac[i]){pat[i]='green';ac[i]=gc[i]=null;}
  for(let i=0;i<n;i++){if(!gc[i])continue;const j=ac.indexOf(gc[i]);if(j>=0){pat[i]='yellow';ac[j]=null;}}
  return pat;
}
function filterPool(pool,guess,pattern){return pool.filter(w=>{const p=getPat(guess,w);return p.every((c,i)=>c===pattern[i]);});}
function wEntropy(guess,pool){
  const counts={};
  pool.forEach(w=>{const k=getPat(guess,w).join('');counts[k]=(counts[k]||0)+1;});
  const n=pool.length;
  return Object.values(counts).reduce((h,c)=>{const p=c/n;return h-p*Math.log2(p);},0);
}
function bestGuess(pool){
  if(pool.length<=2)return pool[0];
  let best=pool[0],bs=-1;
  pool.forEach(w=>{const s=wEntropy(w,pool)+(pool.includes(w)?.1:0);if(s>bs){bs=s;best=w;}});
  return best;
}
function posEntropy(pool,wlen){
  return Array.from({length:wlen},(_,pos)=>{
    const counts={};pool.forEach(w=>{if(pos<w.length){const ch=w[pos];counts[ch]=(counts[ch]||0)+1;}});
    const n=pool.length;
    return +Object.values(counts).reduce((h,c)=>{const p=c/n;return p>0?h-p*Math.log2(p):h;},0).toFixed(3);
  });
}
function keyEntropyH(pool){
  const freq={};pool.forEach(w=>[...new Set(w.split(''))].forEach(ch=>{freq[ch]=(freq[ch]||0)+1;}));
  const n=pool.length,scores={};
  Object.entries(freq).forEach(([ch,c])=>{const p=c/n;scores[ch]=p>0?-p*Math.log2(p)+(1-p>0?-(1-p)*Math.log2(1-p):0):0;});
  return scores;
}

function selGameWord(beliefs,usedIds,targetLen){
  const pool=GW.filter(g=>!usedIds.has(g.id)&&(targetLen===0||g.len===targetLen));
  if(!pool.length)return GW[Math.floor(Math.random()*GW.length)];
  const wb=pool.map(g=>{
    const qt=TERMS.find(t=>t.id===g.id||g.word.startsWith(t.term.split(' ')[0].toUpperCase()));
    return{...g,belief:qt?beliefs[qt.id]:0.5};
  });
  wb.sort((a,b)=>a.belief-b.belief+(Math.random()-.5)*.08);
  return wb[0];
}

function rQuestion(){
  const q=S.q,prog=S.qa/S.qt*100,stars='★'.repeat(q.d)+'☆'.repeat(4-q.d);
  return`<div class="page">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="font-size:11px;font-family:'DM Mono',monospace;color:#aaa">${S.qa+1}/${S.qt}</span>
      <div class="pb" style="flex:1;margin:0"><div class="pf" style="width:${prog}%"></div></div>
      <button class="gbtn" style="padding:5px 10px;font-size:11px" onclick="S.q=null;S.summ=null;go('quiz')">End</button>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
      <span class="badge bt">${q.cat}</span>
      <span class="badge ba">${stars} ${q.d}</span>
      <span class="badge bp">EIG ${q.eig.toFixed(4)} bits</span>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;color:#aaa;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:500">Define this term</div>
      <div class="term-d">${q.term}</div><div class="term-r">${q.root}</div>
    </div>
    ${q.mc.opts.map((o,i)=>{let c='opt';if(S.sel!==null){if(o===q.mc.ok&&o===S.sel)c+=' oc';else if(o===S.sel)c+=' ow';else if(o===q.mc.ok)c+=' or_';}return`<button class="${c}" ${S.sel!==null?'disabled':''} onclick="ans(${i})">${o}</button>`;}).join('')}
    ${S.fb?rFB():''}
    ${S.fb?`<div style="text-align:center;margin-top:14px"><button class="pbtn" style="width:auto;padding:10px 20px" onclick="nextQ()">${S.qa>=S.qt?'View results':'Next question'}</button></div>`:''}
  </div>`;
}
function ans(i){
  if(S.sel!==null)return;
  const o=S.q.mc.opts[i];S.sel=o;const ok=o===S.q.mc.ok;
  const hb=+aE(S.beliefs).toFixed(4);S.beliefs=bUpd(S.beliefs,S.q.id,ok);
  const ha=+aE(S.beliefs).toFixed(4);S.asked.add(S.q.id);S.qa++;if(ok)S._sc++;
  S.fb={ok,hb,ha,d:+(hb-ha).toFixed(4),bl:+(S.beliefs[S.q.id]*100).toFixed(0)};
  if(S.qa>=S.qt)mkSumm();sv();R();
}
function rFB(){const f=S.fb,q=S.q;return`<div class="fb ${f.ok?'ok':'bad'}"><div class="fb-t">${f.ok?'Correct!':'Incorrect'}</div><div class="fb-b">${q.def}</div><div class="pills"><span class="pm">${q.mn}</span>${q.rel.map(r=>`<span class="pr_">${r}</span>`).join('')}<span class="pe">H: ${f.hb.toFixed(3)} → ${f.ha.toFixed(3)}</span><span class="pe">belief ${f.bl}%</span></div></div>`;}
function nextQ(){if(S.summ){go('progress');return;}S.sel=null;S.fb=null;const sel=selNext(S.beliefs,S.asked);if(!sel){mkSumm();R();return;}S.q={...sel.term,mc:mcq(sel.term),eig:sel.eig};R();}
function mkSumm(){
  const acc=S.qa?+(S._sc/S.qa*100).toFixed(1):0,he=+aE(S.beliefs).toFixed(4),ig=+(S._he-he).toFixed(4);
  S.sessions.unshift({id:Date.now(),date:new Date().toLocaleDateString(),q:S.qa,c:S._sc,acc,eS:S._he,eE:he,info:ig});
  const cm=catM(S.beliefs);
  S.summ={acc,q:S.qa,c:S._sc,he,ig,mastery:om(S.beliefs),weak:Object.entries(cm).sort((a,b)=>a[1]-b[1]).slice(0,3)};sv();
}
function rSumm(){const ss=S.summ;return`<div class="page"><div style="text-align:center;padding:1.5rem 0"><div style="font-family:'DM Serif Display',serif;font-size:52px;color:var(--teal);line-height:1;margin-bottom:4px">${ss.acc}%</div><div style="font-size:13px;color:#666;margin-bottom:14px">${ss.c} of ${ss.q} correct</div><div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:16px"><span class="badge bt">Mastery ${ss.mastery}%</span><span class="badge bp">Entropy ${ss.he} bits</span><span class="badge ba">+${ss.ig} bits gained</span></div><div class="card" style="text-align:left;max-width:360px;margin:0 auto 16px"><div class="sec">Improve next</div>${ss.weak.map(([c,s])=>`<div class="brow"><span style="flex:1;font-size:12px">${c}</span><span style="font-size:11px;font-weight:500;color:var(--red)">${s}%</span></div>`).join('')}</div><div style="display:flex;gap:8px;justify-content:center"><button class="pbtn" style="width:auto;padding:9px 18px" onclick="S.summ=null;S.q=null;go('quiz')">New session</button><button class="gbtn" onclick="go('progress')">Progress</button><button style="padding:9px 18px;background:var(--pur-bg);color:var(--pur-dk);border:1px solid var(--pur-b);border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer" onclick="go('game')">MedWordle</button></div></div></div>`;}

/* GAME */
function startGame(tl){
  tl=typeof tl==='number'?tl:(S.gLen||0);S.gLen=tl;
  S.gw=selGameWord(S.beliefs,S.gUsed,tl);
  S.gg=[];S.gc_='';S.gstat='playing';S.ghint=null;S.gEtym=false;S.err=null;
  R();setTimeout(()=>document.addEventListener('keydown',kbGlobal),50);
}
function rGame(){
  if(!S.gw){startGame(0);return'';}
  const gw=S.gw,wlen=gw.len,mx=S.gmx;
  const pool=GW.filter(w=>w.len===wlen).map(w=>w.word);
  let rem=[...pool];S.gg.forEach(({guess,pattern})=>{rem=filterPool(rem,guess,pattern);});
  const pH=posEntropy(rem,wlen),mH=Math.max(...pH,0.001);
  const kH=keyEntropyH(rem);
  const maxKH=Math.max(...Object.values(kH),0.001);
  const keyUsed={};S.gg.forEach(({guess,pattern})=>guess.split('').forEach((ch,i)=>{if(!keyUsed[ch]||keyUsed[ch]==='gray')keyUsed[ch]=pattern[i];}));
  const opener=OPENERS[wlen]||'SEPSIS';
  const left=mx-S.gg.length;
  return`<div class="page"><div class="game-wrap">
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-family:'DM Serif Display',serif;font-size:26px;color:#1a1a1a;margin-bottom:3px">MedWordle</div>
      <div style="font-size:12px;color:#666">Guess the medical term from its definition · ${wlen} letters · ${mx} attempts</div>
    </div>
    <div class="clue-card">
      <span class="clue-cat">${gw.cat}</span>
      <div class="clue-label">Definition — identify this term</div>
      <div class="clue-text">${gw.clue}</div>
      <div class="clue-hint ${S.gEtym?'show':''}">${gw.hint}</div>
      ${S.gstat==='playing'?`<div style="margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button onclick="S.gEtym=!S.gEtym;R();setTimeout(()=>document.addEventListener('keydown',kbGlobal),50)" style="font-size:10px;color:var(--pur-dk);background:#fff;border:1px solid var(--pur-b);padding:3px 9px;border-radius:99px;cursor:pointer">${S.gEtym?'Hide':'Show'} etymology hint</button>
        <span style="font-size:11px;color:var(--pur-dk)">${left} ${left===1?'guess':'guesses'} left · ${rem.length} candidates</span>
      </div>`:''}
    </div>

    ${S.gg.length===0&&S.gstat==='playing'?`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <span style="font-size:11px;color:#aaa">Highest-entropy opener for ${wlen}-letter terms:</span>
      <span class="opener-chip" onclick="useOp('${opener}')">
        <span style="font-size:10px">Use</span><span class="opener-word">${opener}</span>
        <span style="font-size:10px;color:var(--amb)">H=${wEntropy(opener,pool).toFixed(2)}</span>
      </span>
    </div>`:``}

    ${S.gg.length>0&&S.gstat==='playing'?`
    <div>
      <div class="pos-entropy">
        ${pH.map((h,i)=>`<div class="pos-bar-wrap"><div class="pos-bar" style="height:${Math.round(h/mH*38)+3}px;background:${h>mH*.7?'var(--red-b)':h>mH*.4?'var(--amb-b)':'var(--grn-b)'}"></div></div>`).join('')}
      </div>
      <div class="pos-entropy-label">Position uncertainty · red=high entropy (unknown) · green=low (likely identified) · ${rem.length} words remain</div>
    </div>`:''}

    <div class="game-grid" id="ggrid">${rGrid(wlen,mx)}</div>

    ${S.gstat==='solved'?`<div class="solved-banner"><div class="banner-word">${gw.word}</div><div class="banner-sub">Solved in ${S.gg.length} ${S.gg.length===1?'guess':'guesses'} · <em>${gw.hint}</em></div><button class="pbtn" style="width:auto;padding:8px 18px" onclick="nxtGame()">Next term</button></div>`:''}
    ${S.gstat==='failed'?`<div class="failed-banner"><div class="banner-word">${gw.word}</div><div class="banner-sub"><em>${gw.hint}</em></div><button class="pbtn" style="width:auto;padding:8px 18px;background:var(--red);border:none" onclick="nxtGame()">Try another</button></div>`:''}

    ${S.gstat==='playing'&&S.gg.length>0?`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button onclick="showH()" style="font-size:11px;background:var(--pur-bg);color:var(--pur-dk);border:1px solid var(--pur-b);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-weight:500">AI hint (${rem.length} candidates)</button>
      ${S.ghint?`<div class="hint-box">Best guess: <span class="hint-word">${S.ghint}</span><span style="font-size:10px;opacity:.7">max EIG over ${rem.length} remaining</span></div>`:''}
    </div>`:''}

    ${rKbd(keyUsed,kH,maxKH)}

    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px">
      <span style="font-size:11px;color:#aaa">Word length:</span>
      ${[0,6,7,8,9,10,11,12].map(l=>`<button class="len-btn ${S.gLen===l?'on':''}" onclick="startGame(${l})">${l===0?'Any':l}</button>`).join('')}
      <button class="gbtn" style="margin-left:auto;font-size:11px;padding:5px 12px" onclick="startGame(S.gLen)">New term</button>
    </div>

    ${S.ghist.length?`<div class="card" style="margin-top:14px"><div class="sec">Recent games</div>${S.ghist.slice(0,8).map(g=>`<div class="gh-row"><span class="gh-word">${g.word}</span><span style="font-size:10px;color:#aaa;flex:1">${g.cat}</span><span class="gh-res ${g.solved?'gh-ok':'gh-fail'}">${g.solved?`${g.tries} guesses`:'Failed'}</span></div>`).join('')}</div>`:''}
  </div></div>`;
}
function rGrid(wlen,mx){
  const rows=[];
  for(let r=0;r<mx;r++){
    const subm=r<S.gg.length,curr=r===S.gg.length&&S.gstat==='playing';
    const tiles=[];
    for(let c=0;c<wlen;c++){
      let l='',cls='gtile';
      if(subm){l=S.gg[r].guess[c]||'';cls+=` ${S.gg[r].pattern[c]} reveal`;}
      else if(curr){l=S.gc_[c]||'';if(l)cls+=' filled';if(c===S.gc_.length)cls+=' cur-pos';}
      tiles.push(`<div class="${cls}">${l}</div>`);
    }
    rows.push(`<div class="game-row" ${curr?'id="cur-row"':''}>${tiles.join('')}</div>`);
  }
  return rows.join('');
}
function rKbd(keyUsed,kH,maxKH){
  const rows=['QWERTYUIOP'.split(''),'ASDFGHJKL'.split(''),['ENTER',...'ZXCVBNM'.split(''),'⌫']];
  return`<div class="kbd">
    ${S.gg.length>0?`<div style="text-align:center;font-size:10px;color:#bbb;margin-bottom:4px">Purple border = high letter value in remaining candidates</div>`:''}
    ${rows.map(row=>`<div class="kbd-row">${row.map(k=>{
      const wide=k==='ENTER'||k==='⌫';
      let cls='key'+(wide?' wide':'');
      const st=keyUsed[k];if(st)cls+=` ${st}`;
      let ex='';
      if(!st&&kH[k]){const intens=kH[k]/maxKH;ex=`style="border:${Math.round(intens*2)+1}px solid rgba(83,74,183,${(intens*.75).toFixed(2)})"`;}
      return`<button class="${cls}" ${ex} onclick="kbIn('${k}')">${k}</button>`;
    }).join('')}</div>`).join('')}
  </div>`;
}
function upGrid(){const g=document.getElementById('ggrid');if(g)g.innerHTML=rGrid(S.gw.len,S.gmx);}
function useOp(w){S.gc_=w;upGrid();}
function kbIn(k){
  if(S.gstat!=='playing')return;
  if(k==='ENTER'){subGuess();return;}
  if(k==='⌫'){S.gc_=S.gc_.slice(0,-1);upGrid();return;}
  if(S.gc_.length<S.gw.len){S.gc_+=k;upGrid();}
}
function subGuess(){
  if(!S.gw||S.gstat!=='playing')return;
  const guess=S.gc_.toUpperCase();
  if(guess.length!==S.gw.len){const r=document.getElementById('cur-row');if(r){r.classList.add('shake');setTimeout(()=>r.classList.remove('shake'),500);}return;}
  const pattern=getPat(guess,S.gw.word);S.gg.push({guess,pattern});S.gc_='';S.ghint=null;
  const solved=pattern.every(p=>p==='green');
  if(solved){
    S.gstat='solved';S.gUsed.add(S.gw.id);
    S.ghist.unshift({word:S.gw.word,cat:S.gw.cat,solved:true,tries:S.gg.length,date:new Date().toLocaleDateString()});
    const qt=TERMS.find(t=>t.term.toUpperCase().replace(/[^A-Z]/g,'')===S.gw.word||t.id===S.gw.id);
    if(qt)S.beliefs=bUpd(S.beliefs,qt.id,true);
    sv();
  }else if(S.gg.length>=S.gmx){
    S.gstat='failed';S.gUsed.add(S.gw.id);
    S.ghist.unshift({word:S.gw.word,cat:S.gw.cat,solved:false,tries:S.gmx,date:new Date().toLocaleDateString()});
    const qt=TERMS.find(t=>t.term.toUpperCase().replace(/[^A-Z]/g,'')===S.gw.word||t.id===S.gw.id);
    if(qt)S.beliefs=bUpd(S.beliefs,qt.id,false);
    sv();
  }
  document.removeEventListener('keydown',kbGlobal);
  R();
  if(S.gstat==='playing')setTimeout(()=>document.addEventListener('keydown',kbGlobal),50);
}
function showH(){
  const pool=GW.filter(w=>w.len===S.gw.len).map(w=>w.word);
  let rem=[...pool];S.gg.forEach(({guess,pattern})=>{rem=filterPool(rem,guess,pattern);});
  S.ghint=rem.length>0?bestGuess(rem):'?';
  R();setTimeout(()=>document.addEventListener('keydown',kbGlobal),50);
}
function nxtGame(){
  document.removeEventListener('keydown',kbGlobal);
  S.gw=null;S.gg=[];S.gc_='';S.gstat='playing';S.ghint=null;S.gEtym=false;
  startGame(S.gLen);
}

/* PROGRESS */
function rProg(){
  const pt=S.ptab||'overview';
  return`<div class="page"><div style="font-size:22px;font-weight:500;font-family:'DM Serif Display',serif;margin-bottom:14px">Progress</div>
    <div class="tabs">${['overview','knowledge map','history'].map(t=>`<button class="tab ${pt===t?'on':''}" onclick="S.ptab='${t}';R()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
    ${pt==='overview'?rPO():pt==='knowledge map'?rKM():rHist()}
  </div>`;
}
function rPO(){
  const cm=catM(S.beliefs),ovm=om(S.beliefs),h=+aE(S.beliefs).toFixed(4);
  const tq=S.sessions.reduce((s,ss)=>s+ss.q,0),tc=S.sessions.reduce((s,ss)=>s+ss.c,0);
  const acc=tq?+(tc/tq*100).toFixed(1):0;
  const gSol=S.ghist.filter(g=>g.solved).length;
  const avgT=gSol?+(S.ghist.filter(g=>g.solved).reduce((s,g)=>s+g.tries,0)/gSol).toFixed(1):'—';
  const str=TERMS.map(t=>({term:t.term,cat:t.cat,m:+(S.beliefs[t.id]*100).toFixed(1)})).sort((a,b)=>b.m-a.m).slice(0,5);
  const wk=TERMS.map(t=>({term:t.term,cat:t.cat,m:+(S.beliefs[t.id]*100).toFixed(1)})).sort((a,b)=>a.m-b.m).slice(0,5);
  return`
    <div class="g4" style="margin-bottom:12px">
      <div class="met"><div class="ml">Mastery</div><div class="mv t">${ovm}%</div></div>
      <div class="met"><div class="ml">Accuracy</div><div class="mv a">${acc}%</div></div>
      <div class="met"><div class="ml">Sessions</div><div class="mv">${S.sessions.length}</div></div>
      <div class="met"><div class="ml">Entropy</div><div class="mv p" style="font-size:14px;font-family:'DM Mono',monospace">${h}</div></div>
    </div>
    <div class="g4" style="margin-bottom:12px">
      <div class="met"><div class="ml">Games played</div><div class="mv g">${S.ghist.length}</div></div>
      <div class="met"><div class="ml">Games won</div><div class="mv g">${gSol}</div></div>
      <div class="met"><div class="ml">Win rate</div><div class="mv g">${S.ghist.length?+(gSol/S.ghist.length*100).toFixed(0):0}%</div></div>
      <div class="met"><div class="ml">Avg guesses</div><div class="mv">${avgT}</div></div>
    </div>
    <div class="g2">
      <div class="card"><div class="sec">Category mastery</div>${Object.entries(cm).map(([c,s])=>`<div class="brow"><div class="bcat">${c}</div><div class="btrk"><div class="bfil" style="width:${s}%;background:${mc(s)}"></div></div><div class="bpct">${s}%</div></div>`).join('')}</div>
      <div class="card">
        <div class="sec">Strongest</div>${str.map(t=>`<div class="brow"><div style="flex:1"><div style="font-size:11px;font-weight:500">${t.term}</div><div style="font-size:10px;color:#aaa">${t.cat}</div></div><span style="font-size:10px;padding:2px 6px;border-radius:99px;background:var(--grn-bg);color:var(--grn-dk)">${t.m}%</span></div>`).join('')}
        <div class="sep"></div><div class="sec">Weakest</div>${wk.map(t=>`<div class="brow"><div style="flex:1"><div style="font-size:11px;font-weight:500">${t.term}</div><div style="font-size:10px;color:#aaa">${t.cat}</div></div><span style="font-size:10px;padding:2px 6px;border-radius:99px;background:${mb(t.m)};color:${mc(t.m)}">${t.m}%</span></div>`).join('')}
      </div>
    </div>`;
}
function rKM(){
  const bc={};TERMS.forEach(t=>{bc[t.cat]=bc[t.cat]||[];bc[t.cat].push(t);});
  return Object.entries(bc).map(([cat,terms])=>`<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:500;margin-bottom:8px">${cat}</div><div>${terms.map(t=>{const m=+(S.beliefs[t.id]*100).toFixed(1);return`<span class="km-item" style="background:${mb(m)};color:${mc(m)};border-color:${mbr(m)}">${t.term} <span style="font-family:'DM Mono',monospace;font-size:9px">${m}%${S.asked.has(t.id)?' ✓':''}</span></span>`;}).join('')}</div></div>`).join('');
}
function rHist(){
  if(!S.sessions.length&&!S.ghist.length)return`<div style="text-align:center;color:#aaa;padding:2rem">No history yet.</div>`;
  return`${S.sessions.length?`<div class="card" style="margin-bottom:12px"><div class="sec">Quiz sessions</div>${S.sessions.slice(0,10).map(ss=>`<div class="sr"><div style="font-size:10px;font-family:'DM Mono',monospace;color:#aaa;min-width:68px">${ss.date}</div><div style="flex:1;font-size:11px">${ss.q} Q</div><span class="badge bp" style="font-size:9px">-${ss.info?.toFixed(3)||'?'} bits</span><span style="font-size:11px;font-weight:500;color:${mc(ss.acc)}">${ss.acc}%</span></div>`).join('')}</div>`:''}
  ${S.ghist.length?`<div class="card"><div class="sec">MedWordle games</div>${S.ghist.slice(0,12).map(g=>`<div class="gh-row"><span class="gh-word">${g.word}</span><span style="font-size:10px;color:#aaa;flex:1">${g.cat}</span><span style="font-size:10px;font-family:'DM Mono',monospace;color:#bbb">${g.date}</span><span class="gh-res ${g.solved?'gh-ok':'gh-fail'}">${g.solved?`${g.tries} guesses`:'Failed'}</span></div>`).join('')}</div>`:''}`;
}

/* LEADERBOARD */
function rLB(){
  const es=Object.entries(S.users).map(([u,ud])=>{
    const b=ud.beliefs&&Object.keys(ud.beliefs).length?ud.beliefs:initB();
    const m=om(b),q=(ud.sessions||[]).reduce((s,ss)=>s+ss.q,0),c=(ud.sessions||[]).reduce((s,ss)=>s+ss.c,0);
    const gh=ud.ghist||[];const gs=gh.filter(g=>g.solved).length;
    return{u,name:ud.name||u,role:ud.role||'student',mastery:m,acc:q?+(c/q*100).toFixed(1):0,sessions:(ud.sessions||[]).length,h:+aE(b).toFixed(3),gP:gh.length,gS:gs};
  }).sort((a,b)=>b.mastery-a.mastery);
  if(!es.length)return`<div class="page"><div style="text-align:center;color:#aaa;padding:2rem">No users yet.</div></div>`;
  return`<div class="page">
    <div style="font-size:22px;font-weight:500;font-family:'DM Serif Display',serif;margin-bottom:4px">Leaderboard</div>
    <div style="font-size:12px;color:#666;margin-bottom:14px">Ranked by mastery · quiz accuracy · MedWordle performance</div>
    <div class="card">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:1px solid #f0ede8">${['#','User','Mastery','Accuracy','Wordle W/P','Entropy'].map(h=>`<th style="text-align:left;padding:7px 6px;font-size:10px;color:#888;font-weight:500">${h}</th>`).join('')}</tr></thead>
        <tbody>${es.map((e,i)=>`<tr style="border-bottom:1px solid #f8f6f3">
          <td style="padding:9px 6px;font-size:15px;font-weight:500;color:${i<3?'var(--amb)':'#bbb'}">${i+1}</td>
          <td style="padding:9px 6px"><div style="font-size:13px;font-weight:500">${e.name}${e.u===S.user?` <span style="font-size:9px;background:var(--teal-bg);color:var(--teal-dk);padding:1px 5px;border-radius:99px">you</span>`:''}</div><div style="font-size:10px;color:#aaa;text-transform:capitalize">${e.role}</div></td>
          <td style="padding:9px 6px;font-family:'DM Mono',monospace;font-weight:600;color:var(--teal)">${e.mastery}%</td>
          <td style="padding:9px 6px;font-family:'DM Mono',monospace">${e.acc}%</td>
          <td style="padding:9px 6px;font-family:'DM Mono',monospace">${e.gS}/${e.gP}</td>

      </table>
    </div>
  </div>`;
}
